# Fleet: the W-fulltime Microsoft Agent Framework workflow, offline, with fake ports and file
# checkpoints. Graph build, end to end to the approval pause, process kill and resume in a fresh
# interpreter, exactly one publish request, the changes-requested path and the failure rules.
#
# The same job runs the fleet worker (agon.fleet.worker): its offline tests, its end to end run on
# the real graph, and the SDK contract test of its Azure adapters against requirements/worker.txt
# (AGON_REQUIRE_AZURE_SDK=1, so a missing SDK fails instead of skipping). The worker-sdk-guard job
# runs that contract test WITHOUT the SDK and must see it fail (negative control).
#
# The live Cosmos DB kill-and-resume job lives in fleet-cosmos.yml, not here: ci/check_oidc.py
# fails any workflow that a pull request can trigger and that grants id-token: write.
name: fleet

on:
  pull_request:
    paths:
      - "src/agon/**"
      - "tests/fleet/**"
      - "requirements/fleet.txt"
      - "requirements/worker.txt"
      - "requirements/dev.txt"
      - "infra/flows.bicep"
      - ".github/workflows/fleet.yml"
  push:
    branches: [main]
    paths:
      - "src/agon/**"
      - "tests/fleet/**"
      - "requirements/fleet.txt"
      - "requirements/worker.txt"
      - "requirements/dev.txt"
      - "infra/flows.bicep"
      - ".github/workflows/fleet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGON_REQUIRE_AF: "1"
      AGON_REQUIRE_AZURE_SDK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact pins (worker.txt includes fleet.txt)
        run: python -m pip install --disable-pip-version-check -r requirements/worker.txt
      - name: Install the package (editable, pinned backend, no isolation)
        run: python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: No dependency conflicts
        run: python -m pip check --disable-pip-version-check
      - name: Record the resolved package set
        run: python -m pip freeze --disable-pip-version-check | tee "${RUNNER_TEMP}/fleet-pip-freeze.txt"
      - name: Prompt manifest matches the prompt files
        run: python -m agon.agents.prompts
      - name: Fleet tests (Agent Framework required, live Cosmos test excluded)
        run: >
          python -m pytest -q -p no:cacheprovider -rs tests/fleet
          --ignore=tests/fleet/test_fleet_cosmos_live.py
          --basetemp "${RUNNER_TEMP}/fleet-runs"
          --junitxml "${RUNNER_TEMP}/fleet-junit.xml"
      - name: No test may skip here (a skip would hide a missing Agent Framework)
        run: |
          python3 - "${RUNNER_TEMP}/fleet-junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.iter("testcase")
          total = skipped = 0
          for case in cases:
              total += 1
              if case.find("skipped") is not None:
                  skipped += 1
                  print(f"skipped: {case.get('classname')}::{case.get('name')}")
          print(f"fleet tests: {total}, skipped: {skipped}")
          sys.exit(1 if skipped or total == 0 else 0)
          PY
      - name: Keep run directories, junit and pip freeze as evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-evidence
          path: |
            ${{ runner.temp }}/fleet-runs
            ${{ runner.temp }}/fleet-junit.xml
            ${{ runner.temp }}/fleet-pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30

  # Negative control for the worker's SDK contract test: without the SDK and with the variable
  # set, it must fail with its own message, never skip.
  worker-sdk-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned test tooling only (no Azure SDK)
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Install the package (editable, pinned backend, no isolation)
        run: python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: The contract test fails without the SDK when required
        env:
          AGON_REQUIRE_AZURE_SDK: "1"
        run: |
          set +e
          python -m pytest tests/fleet/test_worker_sdk_contract.py -q -p no:cacheprovider > sdk_guard.txt 2>&1
          code=$?
          set -e
          cat sdk_guard.txt
          if [ "$code" -eq 0 ]; then echo "expected a failure, got exit 0"; exit 1; fi
          grep -q "AGON_REQUIRE_AZURE_SDK=1 but the fleet worker's Azure SDK packages are not installed" sdk_guard.txt
