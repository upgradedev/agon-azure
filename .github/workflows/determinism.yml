name: determinism

# Metric M1: the seeded generator must produce byte-identical output on ubuntu and windows.
# Each OS generates seeds 1,2,3 (matches, fixtures manifest, storyline labels) and the full
# fictional season 1 (30 matches: one hash line per match plus the season sha256, and the
# season record) plus the held-out M2 record the Data Lab shows (which must also equal the
# committed src/agon/synth/bands_heldout.json) plus the synthetic kinematics of seeds 1,2,3
# (hash lines and the exact web kinematics files, after the M9 cap check), uploads hash.txt plus
# that output, and a final job
# compares them. A mismatch prints both hash files and the first diverging line and fails.
# Three negative controls prove the comparator has teeth: one mutates a seed 1 event, one a
# season match hash, one a kinematics hash. The check is never relaxed; on divergence, fix the generator.
# A parallel job precomputes the What-If Lab scenario set (python -m agon.whatif --set: K paired
# replays per arm for every scenario of every published seed) on both OS; the compare job diffs the
# two byte for byte, prints the scenario-set sha256 of each, requires the committed set the deploy
# ships (src/agon/whatif/scenario_set), and runs a fourth negative control, on a What-If file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src
  PYTHONHASHSEED: random
  SEEDS: "1,2,3"
  SEASON: "1"

jobs:
  generate:
    name: generate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner (exact pin)
        run: python -m pip install pytest==9.0.2
      - name: Unit tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Generate seeds and hashes
        run: |
          python -m agon.synth.manifest --seeds "$SEEDS" --print-hash \
            --hash-out artifact/hash.txt --out artifact/out
      # The fixtures manifest and the storyline labels sit under out/, so the compare job
      # diffs them byte for byte across OS as well.
      - name: Generate fixtures and storyline labels
        run: |
          python -m agon.synth.fixtures --seeds "$SEEDS" --print-hash --out artifact/out/fixtures.json
          python -m agon.referee.storylines --seeds "$SEEDS" --print-hash --out artifact/out/labels.ndjson
      # The season sits under out/ too, so the compare job diffs every match hash, the season
      # sha256 and the season record byte for byte. --hash-out writes binary LF on every OS.
      - name: Generate the full season (30 matches)
        run: |
          python -m agon.synth.season --season "$SEASON" --print-hash \
            --hash-out "artifact/out/season-$SEASON/hash.txt" --out "artifact/out/season-$SEASON"
      # The Data Lab page shows the committed M2 record, so it is re-measured here on both OS and
      # must equal the committed bytes. Exit 1 is a measurement below the M2 threshold; exit 2
      # means the bands were refused. The fresh record also sits under out/ for the compare job.
      - name: Re-measure the held-out realism bands and require the committed record
        run: |
          set +e
          python -m agon.synth.bands --seeds 1001-1200 --json-out artifact/out/bands-heldout.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "bands refused (exit $code)"
            exit "$code"
          fi
          python -c "import sys; a = open(sys.argv[1], 'rb').read(); b = open(sys.argv[2], 'rb').read(); sys.exit(0 if a == b else 'the fresh M2 record differs from src/agon/synth/bands_heldout.json: re-measure and commit it')" artifact/out/bands-heldout.json src/agon/synth/bands_heldout.json
          echo "committed M2 record reproduced"
      # Synthetic kinematics (metric M9): the CLI exits 1 on any cap violation, so this step is the
      # gate on every OS, and --mutate (one planted teleport) must make it fail. The hash lines and
      # the exact web kinematics bytes go under out/, so the compare job diffs them across OS too.
      - name: Synthetic kinematics, M9 cap check and web files
        run: |
          python -m agon.synth.kinematics --seeds "$SEEDS" --print-hash --hash-out artifact/out/kinematics/hash.txt
          python -m agon.webkinematics --seeds "$SEEDS" --out artifact/out/kinematics/web
          if python -m agon.synth.kinematics --seeds 1 --mutate > /dev/null; then
            echo "M9 passed a planted teleport: the check has no teeth"
            exit 1
          fi
          echo "M9 refused the planted teleport as required"
      - uses: actions/upload-artifact@v4
        with:
          name: synth-${{ matrix.os }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  whatif:
    name: whatif (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      ran: ${{ steps.scope.outputs.ran }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The set is a pure function of the engine, interpret, the Fact Gate's definitions and the lab,
      # and takes minutes per OS. A pull request that touches none of those inputs skips it (the step
      # summary says so); a push to main and a manual run always compute it.
      - name: Decide whether the What-If inputs changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ran=true
          if [ "$EVENT" = "pull_request" ]; then
            if git diff --name-only "$BASE" HEAD | grep -Eq '^(src/agon/(synth|interpret|whatif)/|src/agon/governance/recompute\.py$|\.github/workflows/determinism\.yml$)'; then
              ran=true
            else
              ran=false
              echo "What-If inputs unchanged in this pull request: the scenario set is not recomputed here (it is on every push to main)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "ran=$ran" >> "$GITHUB_OUTPUT"
          echo "What-If set computed: $ran"
      # Hash lines (no paths, no timings) go to stdout and hash.txt; the total wall time goes to stderr.
      - name: Precompute the What-If scenario set (K paired replays per arm)
        if: steps.scope.outputs.ran == 'true'
        run: |
          python -m agon.whatif --set --seeds "$SEEDS" --print-hash --hash-out whatif/hash.txt --out whatif/out
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.ran == 'true'
        with:
          name: whatif-${{ matrix.os }}
          path: whatif/
          if-no-files-found: error
          retention-days: 14

  compare:
    name: compare ubuntu vs windows
    needs: [generate, whatif]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: synth-*
          path: hashes
      - uses: actions/download-artifact@v4
        if: needs.whatif.outputs.ran == 'true'
        with:
          pattern: whatif-*
          path: whatif
      - name: List what was downloaded
        run: find hashes -maxdepth 2 | sort
      - name: Negative control (a one-byte change must fail the comparator)
        run: |
          cp -r hashes/synth-ubuntu-latest mutated
          python - <<'PY'
          path = "mutated/out/seed-0001/events.ndjson"
          data = bytearray(open(path, "rb").read())
          pos = data.index(b'"seq":3,')
          data[pos + 6] = ord("4")
          open(path, "wb").write(bytes(data))
          PY
          if python -m agon.synth.crosscheck hashes/synth-ubuntu-latest mutated; then
            echo "comparator passed a mutated output: the gate has no teeth"
            exit 1
          fi
          echo "negative control failed as required"
      - name: Negative control on the season (one changed match hash must fail the comparator)
        run: |
          cp -r hashes/synth-ubuntu-latest mutated-season
          python - <<'PY'
          import os
          path = os.path.join("mutated-season", "out", "season-" + os.environ["SEASON"], "hash.txt")
          lines = open(path, "rb").read().split(b"\n")
          i = next(k for k, line in enumerate(lines) if line.startswith(b"match 17 "))
          lines[i] = lines[i][:-1] + (b"0" if lines[i][-1:] != b"0" else b"1")
          open(path, "wb").write(b"\n".join(lines))
          PY
          if python -m agon.synth.crosscheck hashes/synth-ubuntu-latest mutated-season; then
            echo "comparator passed a mutated season hash: the gate has no teeth"
            exit 1
          fi
          echo "season negative control failed as required"
      - name: Negative control on the kinematics (one changed hash must fail the comparator)
        run: |
          cp -r hashes/synth-ubuntu-latest mutated-kinematics
          python - <<'PY'
          path = "mutated-kinematics/out/kinematics/hash.txt"
          lines = open(path, "rb").read().split(b"\n")
          i = next(k for k, line in enumerate(lines) if line.startswith(b"seed 2 "))
          lines[i] = lines[i][:-1] + (b"0" if lines[i][-1:] != b"0" else b"1")
          open(path, "wb").write(b"\n".join(lines))
          PY
          if python -m agon.synth.crosscheck hashes/synth-ubuntu-latest mutated-kinematics; then
            echo "comparator passed a mutated kinematics hash: the gate has no teeth"
            exit 1
          fi
          echo "kinematics negative control failed as required"
      - name: Season and kinematics hashes on each OS
        run: |
          for os in ubuntu-latest windows-latest; do
            echo "$os: $(tail -n 1 "hashes/synth-$os/out/season-$SEASON/hash.txt")"
            grep "^seed " "hashes/synth-$os/out/kinematics/hash.txt" | sed "s/^/$os: kinematics /"
          done
      - name: Compare ubuntu and windows outputs
        run: python -m agon.synth.crosscheck hashes/synth-ubuntu-latest hashes/synth-windows-latest
      - name: Negative control on the What-If set (a one-byte change must fail the comparator)
        if: needs.whatif.outputs.ran == 'true'
        run: |
          cp -r whatif/whatif-ubuntu-latest mutated-whatif
          python - <<'PY'
          path = "mutated-whatif/out/whatif-1.json"
          data = bytearray(open(path, "rb").read())
          pos = data.index(b'"k":')
          data[pos + 4] = ord("9") if data[pos + 4] != ord("9") else ord("8")
          open(path, "wb").write(bytes(data))
          PY
          if python -m agon.synth.crosscheck whatif/whatif-ubuntu-latest mutated-whatif; then
            echo "comparator passed a mutated What-If file: the gate has no teeth"
            exit 1
          fi
          echo "What-If negative control failed as required"
      - name: What-If scenario-set sha256 on each OS
        if: needs.whatif.outputs.ran == 'true'
        run: |
          for os in ubuntu-latest windows-latest; do
            echo "$os: $(tail -n 1 "whatif/whatif-$os/hash.txt")"
          done
      - name: Compare the What-If set on ubuntu and windows
        if: needs.whatif.outputs.ran == 'true'
        run: python -m agon.synth.crosscheck whatif/whatif-ubuntu-latest whatif/whatif-windows-latest
      # The deploy ships the committed set; it must be exactly what both OS just computed.
      - name: Require the committed What-If set
        if: needs.whatif.outputs.ran == 'true'
        run: |
          python - <<'PY'
          import os, sys
          fresh, committed = "whatif/whatif-ubuntu-latest", "src/agon/whatif/scenario_set"
          pairs = [(os.path.join(fresh, "hash.txt"), os.path.join(committed, "hash.txt"))]
          pairs += [(os.path.join(fresh, "out", n), os.path.join(committed, n)) for n in sorted(os.listdir(os.path.join(fresh, "out")))]
          names = sorted(n for n in os.listdir(committed) if n != "hash.txt")
          if names != sorted(os.listdir(os.path.join(fresh, "out"))):
              sys.exit(f"committed files {names} differ from the fresh set")
          for a, b in pairs:
              if open(a, "rb").read() != open(b, "rb").read():
                  sys.exit(f"{b} differs from the fresh set: python -m agon.whatif --set --seeds 1,2,3 --out src/agon/whatif/scenario_set --hash-out src/agon/whatif/scenario_set/hash.txt")
          print(f"committed What-If set reproduced: {len(pairs)} files")
          PY
