name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # gitleaks v8.30.1, pinned by image index digest (read from ghcr.io on 2026-10-19).
  # The gitleaks GitHub Action needs a paid licence secret for organisation repos,
  # so the official image is run directly instead.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  # gitleaks over the full history, after a negative control on a planted token.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Negative control, the scanner must catch a planted token
        run: |
          mkdir -p "$RUNNER_TEMP/canary"
          # The token is assembled at run time so no secret-shaped literal is ever committed.
          python3 -c "import random, string; print('token = ghp_' + ''.join(random.choices(string.ascii_letters + string.digits, k=36)))" > "$RUNNER_TEMP/canary/planted.txt"
          set +e
          docker run --rm -v "$RUNNER_TEMP/canary:/canary:ro" "$GITLEAKS_IMAGE" dir /canary --no-banner --redact --exit-code 1
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "negative control failed: gitleaks exited $code on a planted token, expected 1"
            exit 1
          fi
          echo "negative control passed: planted token detected"
      - name: Scan the full git history
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$GITLEAKS_IMAGE" git /repo --no-banner --redact --verbose --exit-code 1

  # Every test under tests/, on Python 3.12, against an editable install.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned test tooling
        run: python -m pip install -r requirements/dev.txt
      - name: Install the package (editable, pinned backend, no isolation)
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Run tests
        run: python -m pytest -q

  # Every requirements file line must be an exact == pin.
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python ci/check_pins.py

  # No em or en dash in any text file, selected by path from git.
  dashes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python ci/check_dashes.py

  # No workflow that pull requests can trigger may mint an OIDC token. An
  # accident guard only: a branch can edit this check in its own diff, so the
  # real boundary is removing the pull_request federated subject in Entra.
  oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python ci/check_oidc.py

  # The readiness gate must fail on broken fixtures and pass on a good one.
  readiness-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned test tooling
        run: python -m pip install -r requirements/dev.txt
      - name: Run the readiness self-test
        run: python -m pytest -q tests/test_readiness.py

  # Bicep compile and lint, no Azure login. Every error AND every warning fails
  # (ci/bicep_check.py), after a negative control proves a known warning is caught.
  # The CLI version matches deploy.yml, so what lints is what deploys.
  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BICEP_VERSION: v0.44.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Bicep CLI (no login needed)
        run: |
          az config set bicep.use_binary_from_path=false bicep.check_version=false --only-show-errors
          az bicep install --version "$BICEP_VERSION"
          "$HOME/.azure/bin/bicep" --version
      - name: Negative control, a known linter warning must fail the check
        run: python ci/bicep_check.py --runner bicep --bicep "$HOME/.azure/bin/bicep" --expect-fail ci/fixtures/bicep_warning.bicep
      - name: Build and lint main.bicep, rbac.bicep and ai.bicep, failing on any warning
        run: python ci/bicep_check.py --runner bicep --bicep "$HOME/.azure/bin/bicep" infra/main.bicep infra/rbac.bicep infra/ai.bicep
      # The same two checks through `az bicep build`, which reports Bicep warnings
      # through its own log; the negative control proves they still reach the gate.
      - name: Negative control through az bicep build
        run: python ci/bicep_check.py --runner az --expect-fail ci/fixtures/bicep_warning.bicep
      - name: Build and lint through az bicep build, failing on any warning
        run: python ci/bicep_check.py --runner az infra/main.bicep infra/rbac.bicep infra/ai.bicep
