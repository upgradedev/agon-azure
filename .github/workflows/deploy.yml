# Deploy Agon to Azure and prove the public URL serves the commit (spec 9.1, 9.2, 11.2 S8).
#
# what-if    main only, before every deploy: compiles main.bicep and asks Azure what
#            would change. It is not run on pull requests (see below).
# deploy     main only, environment azure: incremental deployment of main.bicep.
# web-build  main only, no Azure identity (no id-token, no environment): builds the
#            React console (console/) from its committed lock, prerenders it,
#            generates the recorded synthetic data for the published seeds, stamps
#            the commit and the season files, runs ci/web_check.py and the live
#            readiness gate offline on those exact bytes, and uploads them as the
#            artifact agon-site. Third-party build code never runs where a token
#            can be minted.
# web        main only, environment azure: downloads agon-site, runs
#            ci/web_check.py again on the downloaded bytes, fetches the Static Web
#            Apps token at run time and uploads them. web/ is no longer uploaded.
# readiness  main only: the live gate (ci/readiness.py) against the deployed host,
#            with the commit sha as a required body marker. Fails on any non-200.
# ai         main only, environment azure, after deploy: lints, what-ifs and deploys
#            infra/ai.bicep (Foundry, Translator, Speech) as its own deployment,
#            agon-ai. web and readiness do not depend on it, so a first-deploy
#            failure of an AI resource (a free-tier slot taken, terms not
#            accepted, model capacity or version refused) never holds back the
#            public site, and agon-main, which the scheduled readiness check
#            reads, never fails because of it.
# foundry-smoke  main only, after ai: one model call to the Foundry deployment
#            (.github/workflows/foundry-smoke.yml, gate C2). Fails on any non-200,
#            including the refusal expected until the owner-side rbac deploy has
#            run: HTTP 401 or 403 with error code PermissionDenied.
#
# The CI identity holds Contributor on the resource group only. It cannot write
# role assignments, so infra/rbac.bicep is NOT deployed here (docs/OPERATIONS.md).
# main.bicep takes ciPrincipalId, the object id of that identity, for its Cosmos
# checkpoints grant. It is read from the oid claim of the job's own ARM token,
# because reading it from Microsoft Graph needs a directory role CI does not hold.
#
# No job here runs on pull_request. A pull request workflow runs the diff of its
# own branch before anyone reviews it, and the only Azure identity this repo has
# holds Contributor on the group. So pull requests get compile and lint only (the
# bicep job in ci.yml, no login), and the Azure what-if diff is read on main just
# before the deploy. The pull_request federated subject must also be removed on
# the owner side, because a branch could add its own workflow that uses it
# (docs/OPERATIONS.md, step 4). Do not add pull_request back without a separate
# Reader plus whatIf identity.
# Actions are pinned by full commit sha; the comment names the version and how the
# sha was read.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "web/**"
      - "console/**"
      - "src/agon/**"
      - "requirements/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
      - "ci/readiness.py"
      - "ci/readiness.json"
      - "ci/stamp_web.py"
  workflow_dispatch:

permissions:
  contents: read

# Every run shares one group and never cancels a running one, so two deploys
# never overlap.
concurrency:
  group: deploy-azure-main
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  DEPLOYMENT_NAME: agon-main
  # infra/ai.bicep deploys under its own name (job ai), so it can fail alone.
  AI_DEPLOYMENT_NAME: agon-ai
  # infra/flows.bicep (approval Logic Apps) deploys under its own name (job flows).
  FLOWS_DEPLOYMENT_NAME: agon-flows
  # infra/apps.bicep (Container Apps jobs) deploys under its own name (job apps).
  APPS_DEPLOYMENT_NAME: agon-apps
  # Same Bicep CLI as the ci.yml bicep job, so what lints is what deploys.
  BICEP_VERSION: v0.44.1
  # The three published demo seeds. ci/readiness.json pins the same three in the
  # demo-data markers; change both together.
  PUBLISHED_SEEDS: "1,2,3"

jobs:
  what-if:
    # Only main has a federated subject, so a manual run from any other branch
    # would only fail at login.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0 (peeled tag, git ls-remote 2026-10-19)
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Pin the Bicep CLI
        run: |
          az config set bicep.use_binary_from_path=false bicep.check_version=false --only-show-errors
          az bicep install --version "$BICEP_VERSION"
          az bicep version
      - name: Read the CI principal object id from the oid claim of its own token
        run: |
          az account get-access-token --query accessToken --output tsv | python3 -c '
          import base64, json, os, re, sys
          payload = sys.stdin.read().strip().split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          oid = claims.get("oid", "")
          if not re.fullmatch(r"[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}", oid):
              sys.exit("no service principal object id (oid) in the access token")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("CI_PRINCIPAL_ID=" + oid + chr(10))
          print("CI principal object id: " + oid)
          '
      - name: What-if (read only)
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep \
            --parameters location="$LOCATION" ciPrincipalId="$CI_PRINCIPAL_ID"

  deploy:
    needs: what-if
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure
    permissions:
      contents: read
      id-token: write
    outputs:
      static_site_name: ${{ steps.outputs.outputs.static_site_name }}
      static_site_hostname: ${{ steps.outputs.outputs.static_site_hostname }}
      storage_account: ${{ steps.outputs.outputs.storage_account }}
      feed_base_url: ${{ steps.outputs.outputs.feed_base_url }}
      app_insights_name: ${{ steps.outputs.outputs.app_insights_name }}
      registry_name: ${{ steps.outputs.outputs.registry_name }}
      registry_login_server: ${{ steps.outputs.outputs.registry_login_server }}
      container_env_name: ${{ steps.outputs.outputs.container_env_name }}
      cosmos_account_name: ${{ steps.outputs.outputs.cosmos_account_name }}
      cosmos_database_name: ${{ steps.outputs.outputs.cosmos_database_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0 (peeled tag, git ls-remote 2026-10-19)
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Pin the Bicep CLI
        run: |
          az config set bicep.use_binary_from_path=false bicep.check_version=false --only-show-errors
          az bicep install --version "$BICEP_VERSION"
          az bicep version
      - name: Read the CI principal object id from the oid claim of its own token
        run: |
          az account get-access-token --query accessToken --output tsv | python3 -c '
          import base64, json, os, re, sys
          payload = sys.stdin.read().strip().split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          oid = claims.get("oid", "")
          if not re.fullmatch(r"[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}", oid):
              sys.exit("no service principal object id (oid) in the access token")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("CI_PRINCIPAL_ID=" + oid + chr(10))
          print("CI principal object id: " + oid)
          '
      - name: Deploy main.bicep (incremental only, never complete)
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep \
            --parameters location="$LOCATION" ciPrincipalId="$CI_PRINCIPAL_ID" \
            --mode Incremental \
            --output json > "$RUNNER_TEMP/deployment.json"
      - name: Capture the deployment outputs
        id: outputs
        run: |
          python3 - "$RUNNER_TEMP/deployment.json" <<'PY'
          import json, os, re, sys
          outputs = json.load(open(sys.argv[1], encoding="utf-8"))["properties"]["outputs"]
          value = lambda key: outputs[key]["value"]
          host = value("staticSiteDefaultHostname")
          # A bare lowercase DNS name, so nothing downstream can be pointed elsewhere.
          if not re.fullmatch(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9-]{2,63}", host):
              sys.exit(f"unexpected static site hostname: {host!r}")
          rows = {
              "static_site_name": value("staticSiteName"),
              "static_site_hostname": host,
              "storage_account": value("storageAccountName"),
              "feed_base_url": value("feedBaseUrl"),
              "app_insights_name": value("appInsightsName"),
              "registry_name": value("registryName"),
              "registry_login_server": value("registryLoginServer"),
              "container_env_name": value("containerEnvName"),
              "cosmos_account_name": value("cosmosAccountName"),
              "cosmos_database_name": value("cosmosDatabaseName"),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key, val in rows.items():
                  fh.write(f"{key}={val}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### main.bicep outputs\n\n| output | value |\n|---|---|\n")
              for key in sorted(outputs):
                  fh.write(f"| {key} | `{json.dumps(outputs[key]['value'])}` |\n")
          print("\n".join(f"{k}: {v}" for k, v in rows.items()))
          PY

  # The site is built where no Azure token can be minted: npm ci and the Vite build
  # run third-party code, so this job holds contents: read only. The web job below
  # receives the built bytes as an artifact and never runs npm.
  web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Exact pins in package.json, and the committed lock agrees with them
        working-directory: console
        run: |
          test -f package-lock.json
          node scripts/check-deps.mjs
          node scripts/check-deps.mjs --lock
      - name: Install from the committed lock (no install scripts)
        working-directory: console
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and prerender every view into index.html (runs from web/runs)
        working-directory: console
        run: npm run build
      - name: Generate the recorded synthetic data for the published seeds
        run: |
          rm -rf console/dist/data
          python -m agon.webdata --seeds "$PUBLISHED_SEEDS" --out console/dist/data
      # The stamp copies every exported cue file in web/cues (absent until a charter is approved) into
      # the site and lists it, so a committed cue file always reaches the page.
      - name: Stamp the commit, re-hash the data, write the season, match, cue and ops files and verify the runs
        run: python ci/stamp_web.py console/dist --sha "$GITHUB_SHA" --data-dir console/dist/data --seeds "$PUBLISHED_SEEDS"
      - name: Static checks on the exact tree that ships
        run: python ci/web_check.py console/dist
      - name: The live readiness gate, offline, on the exact bytes that ship
        run: |
          python console/scripts/readiness_offline.py console/dist "$RUNNER_TEMP/readiness" README.md
          python ci/readiness.py --offline "$RUNNER_TEMP/readiness" --set-host agon.example --add-marker "demo=$GITHUB_SHA"
      - name: Hand the checked site to the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agon-site
          path: console/dist/
          if-no-files-found: error
          retention-days: 7

  web:
    needs: [deploy, web-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure
    permissions:
      contents: read
      id-token: write
    env:
      SWA_NAME: ${{ needs.deploy.outputs.static_site_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Into the workspace, not RUNNER_TEMP: the Static Web Apps action runs in a
      # container that mounts only the workspace.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (git ls-remote 2026-10-19)
        with:
          name: agon-site
          path: site
      - name: Static checks again on the downloaded bytes, the exact tree that uploads
        run: python ci/web_check.py site
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0 (peeled tag, git ls-remote 2026-10-19)
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch the deployment token at run time (never a repo secret)
        id: token
        run: |
          token="$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey --output tsv)"
          if [ -z "$token" ]; then
            echo "no deployment token returned for $SWA_NAME"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      # No release tags exist for v1; the sha is the head of the v1 branch, read with
      # git ls-remote on 2026-10-19. The action pulls a container image that this pin
      # does not fix (see docs/OPERATIONS.md, risks).
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 (branch head)
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: site
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  # The AI services as their own deployment, agon-ai, after agon-main. Nothing on
  # the public path (web, readiness) needs this job, so its failure stays here.
  ai:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure
    permissions:
      contents: read
      id-token: write
    # The fleet job in agon-apps reads these (job apps); none of them is a secret.
    outputs:
      foundry_project_endpoint: ${{ steps.ai_outputs.outputs.foundry_project_endpoint }}
      foundry_deployment_names: ${{ steps.ai_outputs.outputs.foundry_deployment_names }}
      translator_custom_endpoint: ${{ steps.ai_outputs.outputs.translator_custom_endpoint }}
      speech_endpoint: ${{ steps.ai_outputs.outputs.speech_endpoint }}
      speech_resource_id: ${{ steps.ai_outputs.outputs.speech_resource_id }}
    env:
      APP_INSIGHTS_NAME: ${{ needs.deploy.outputs.app_insights_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0 (peeled tag, git ls-remote 2026-10-19)
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Pin the Bicep CLI
        run: |
          az config set bicep.use_binary_from_path=false bicep.check_version=false --only-show-errors
          az bicep install --version "$BICEP_VERSION"
          az bicep version
      # ci.yml lints main.bicep and rbac.bicep on every pull request; until it also
      # lists ai.bicep, this step is the warning gate on it, with the same script.
      - name: Build and lint ai.bicep, failing on any warning
        run: python3 ci/bicep_check.py --runner az infra/ai.bicep
      - name: Check the agon-main input
        run: |
          if [ -z "$APP_INSIGHTS_NAME" ]; then
            echo "deploy job returned no appInsightsName output"
            exit 1
          fi
      - name: What-if ai.bicep (read only)
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AI_DEPLOYMENT_NAME" \
            --template-file infra/ai.bicep \
            --parameters location="$LOCATION" appInsightsName="$APP_INSIGHTS_NAME"
      - name: Deploy ai.bicep (incremental only, never complete)
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AI_DEPLOYMENT_NAME" \
            --template-file infra/ai.bicep \
            --parameters location="$LOCATION" appInsightsName="$APP_INSIGHTS_NAME" \
            --mode Incremental \
            --output json > "$RUNNER_TEMP/ai-deployment.json"
      - name: AI outputs in the job summary and as job outputs for the fleet job
        id: ai_outputs
        run: |
          python3 - "$RUNNER_TEMP/ai-deployment.json" <<'PY'
          import json, os, sys
          outputs = json.load(open(sys.argv[1], encoding="utf-8"))["properties"]["outputs"]
          rows = {
              "foundry_project_endpoint": outputs["foundryProjectEndpoint"]["value"],
              "foundry_deployment_names": json.dumps(outputs["foundryDeploymentNames"]["value"], separators=(",", ":")),
              "translator_custom_endpoint": outputs["translatorCustomEndpoint"]["value"],
              "speech_endpoint": outputs["speechEndpoint"]["value"],
              "speech_resource_id": outputs["speechResourceId"]["value"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key, val in rows.items():
                  fh.write(f"{key}={val}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### ai.bicep outputs (deployment agon-ai)\n\n| output | value |\n|---|---|\n")
              for key in sorted(outputs):
                  fh.write(f"| {key} | `{json.dumps(outputs[key]['value'])}` |\n")
          print("\n".join(f"{k}: {json.dumps(outputs[k]['value'])}" for k in sorted(outputs)))
          PY

  # Gate C2: one model call to what the ai job just deployed. Independent of web
  # and readiness, so a red smoke never holds back the public site.
  foundry-smoke:
    needs: ai
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/foundry-smoke.yml
    with:
      deployment: gpt-5.6-luna

  readiness:
    needs: [deploy, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ needs.deploy.outputs.static_site_hostname }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # A bounded wait for the CDN to serve the new upload. It never passes or fails
      # anything: the gate below runs exactly once and decides.
      - name: Wait until the new commit is served (at most 20 x 15 s)
        run: |
          for attempt in $(seq 1 20); do
            # No pipe into grep -q: under pipefail an early grep exit fails curl.
            body="$(curl --silent --max-time 20 "https://$HOST/" || true)"
            case "$body" in
              *"$GITHUB_SHA"*)
                echo "attempt $attempt: commit $GITHUB_SHA is served"
                exit 0
                ;;
            esac
            echo "attempt $attempt: commit $GITHUB_SHA not served yet"
            sleep 15
          done
          echo "commit not seen after 20 attempts; the readiness gate decides"
      - name: Readiness gate, live, run once
        run: |
          set -o pipefail
          python ci/readiness.py --live --set-host "$HOST" --add-marker "demo=$GITHUB_SHA" | tee "$RUNNER_TEMP/readiness.txt"
      - name: Readiness table in the job summary
        if: always()
        run: |
          {
            echo "### Readiness, commit $GITHUB_SHA, https://$HOST/"
            echo
            echo '```'
            cat "$RUNNER_TEMP/readiness.txt" 2>/dev/null || echo "no readiness output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Spec 14 items 4 and 5: the Teams card lifecycle and the Outlook approval email
  # as Logic Apps (infra/flows.bicep). Independent of web and readiness, so a red
  # flows job never holds back the public site.
  #
  # User-gated until the owner sets the repository variables AGON_TEAMS_GROUP_ID
  # and AGON_TEAMS_CHANNEL_ID (the ids of team "agon" and its approval channel);
  # until then the job writes "user-gated" in its summary and deploys nothing.
  # The Outlook connection is created once and never redeployed (its OAuth consent
  # must survive); the Outlook flow deploys only once that connection is Connected
  # and AGON_OFFICER_EMAIL is set.
  flows:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure
    permissions:
      contents: read
      id-token: write
    env:
      STORAGE_ACCOUNT: ${{ needs.deploy.outputs.storage_account }}
      TEAMS_GROUP_ID: ${{ vars.AGON_TEAMS_GROUP_ID }}
      TEAMS_CHANNEL_ID: ${{ vars.AGON_TEAMS_CHANNEL_ID }}
      TEAMS_NEWSROOM_CHANNEL_ID: ${{ vars.AGON_TEAMS_NEWSROOM_CHANNEL_ID }}
      OFFICER_EMAIL: ${{ vars.AGON_OFFICER_EMAIL }}
      CI_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: User gate, the team and channel ids
        id: gate
        run: |
          if [ -z "$TEAMS_GROUP_ID" ] || [ -z "$TEAMS_CHANNEL_ID" ]; then
            msg="user-gated: set repository variables AGON_TEAMS_GROUP_ID and AGON_TEAMS_CHANNEL_ID (owner); nothing deployed"
            echo "$msg"
            echo "### flows: $msg" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0 (peeled tag, git ls-remote 2026-10-19)
        if: steps.gate.outputs.ready == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Pin the Bicep CLI
        if: steps.gate.outputs.ready == 'true'
        run: |
          az config set bicep.use_binary_from_path=false bicep.check_version=false --only-show-errors
          az bicep install --version "$BICEP_VERSION"
          az bicep version
      - name: Build and lint flows.bicep and connections.bicep, failing on any warning
        if: steps.gate.outputs.ready == 'true'
        run: python3 ci/bicep_check.py --runner az infra/flows.bicep infra/connections.bicep
      - name: Check the agon-main input
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "deploy job returned no storageAccountName output"
            exit 1
          fi
      - name: Create the Outlook connection once, never redeploy it
        if: steps.gate.outputs.ready == 'true'
        run: |
          if az resource show --resource-group "$RESOURCE_GROUP" --resource-type Microsoft.Web/connections --name agon-outlook --output none 2>/dev/null; then
            echo "agon-outlook exists; not redeployed"
          else
            az deployment group create               --resource-group "$RESOURCE_GROUP"               --name agon-connections               --template-file infra/connections.bicep               --parameters location="$LOCATION"               --mode Incremental --output none
            echo "agon-outlook created; it needs the owner's consent (docs/OPERATIONS.md)"
          fi
      - name: Is the Outlook connection authorised?
        if: steps.gate.outputs.ready == 'true'
        id: outlook
        run: |
          status="$(az resource show --resource-group "$RESOURCE_GROUP" --resource-type Microsoft.Web/connections --name agon-outlook --query "properties.overallStatus" --output tsv 2>/dev/null || true)"
          echo "agon-outlook status: ${status:-unknown}"
          if [ "$status" = "Connected" ] && [ -n "$OFFICER_EMAIL" ]; then
            echo "connected=true" >> "$GITHUB_OUTPUT"
          else
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "### flows: Outlook approval flow not deployed (connection status '${status:-unknown}', officer email $([ -n "$OFFICER_EMAIL" ] && echo set || echo unset)); user-gated" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: What-if flows.bicep (read only)
        if: steps.gate.outputs.ready == 'true'
        run: |
          az deployment group what-if             --resource-group "$RESOURCE_GROUP"             --name "$FLOWS_DEPLOYMENT_NAME"             --template-file infra/flows.bicep             --parameters location="$LOCATION" storageAccountName="$STORAGE_ACCOUNT"                          teamsGroupId="$TEAMS_GROUP_ID" teamsChannelId="$TEAMS_CHANNEL_ID"                          ciClientId="$CI_CLIENT_ID" outlookConnected="${{ steps.outlook.outputs.connected }}"                          officerEmail="$OFFICER_EMAIL" teamsNewsroomChannelId="$TEAMS_NEWSROOM_CHANNEL_ID"
      - name: Deploy flows.bicep (incremental only, never complete)
        if: steps.gate.outputs.ready == 'true'
        run: |
          az deployment group create             --resource-group "$RESOURCE_GROUP"             --name "$FLOWS_DEPLOYMENT_NAME"             --template-file infra/flows.bicep             --parameters location="$LOCATION" storageAccountName="$STORAGE_ACCOUNT"                          teamsGroupId="$TEAMS_GROUP_ID" teamsChannelId="$TEAMS_CHANNEL_ID"                          ciClientId="$CI_CLIENT_ID" outlookConnected="${{ steps.outlook.outputs.connected }}"                          officerEmail="$OFFICER_EMAIL" teamsNewsroomChannelId="$TEAMS_NEWSROOM_CHANNEL_ID"             --mode Incremental --query "properties.outputs" --output json

  # Spec 3.2 rows 2, 9, 11 and 16: build the one job image, push it to the registry
  # as <registry>/agon:<commit sha>, then deploy infra/apps.bicep (deployment
  # agon-apps). Independent of web and readiness. Until the owner-side rbac deploy
  # grants AcrPull and the queue roles, the jobs exist but their executions fail
  # to pull or to read the queues; the job summary says so.
  #
  # It waits for ai and flows, because the fleet job takes the agon-ai outputs and
  # the trigger URLs of the approval Logic Apps, but it runs whatever they end as:
  # a failed ai job leaves the AI parameters empty and apps.bicep then skips the
  # fleet job (the intake job still deploys); a Logic App that does not exist
  # leaves its URL empty and the worker posts no card on that channel.
  apps:
    needs: [deploy, ai, flows]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY_NAME: ${{ needs.deploy.outputs.registry_name }}
      REGISTRY_LOGIN_SERVER: ${{ needs.deploy.outputs.registry_login_server }}
      CONTAINER_ENV_NAME: ${{ needs.deploy.outputs.container_env_name }}
      STORAGE_ACCOUNT: ${{ needs.deploy.outputs.storage_account }}
      COSMOS_ACCOUNT: ${{ needs.deploy.outputs.cosmos_account_name }}
      COSMOS_DATABASE: ${{ needs.deploy.outputs.cosmos_database_name }}
      STATIC_SITE_HOSTNAME: ${{ needs.deploy.outputs.static_site_hostname }}
      AI_RESULT: ${{ needs.ai.result }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ needs.ai.outputs.foundry_project_endpoint }}
      FOUNDRY_DEPLOYMENT_NAMES: ${{ needs.ai.outputs.foundry_deployment_names }}
      TRANSLATOR_CUSTOM_ENDPOINT: ${{ needs.ai.outputs.translator_custom_endpoint }}
      SPEECH_ENDPOINT: ${{ needs.ai.outputs.speech_endpoint }}
      SPEECH_RESOURCE_ID: ${{ needs.ai.outputs.speech_resource_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the agon-main inputs
        run: |
          for name in REGISTRY_NAME REGISTRY_LOGIN_SERVER CONTAINER_ENV_NAME STORAGE_ACCOUNT COSMOS_ACCOUNT COSMOS_DATABASE; do
            if [ -z "${!name}" ]; then echo "deploy job returned no value for $name"; exit 1; fi
          done
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0 (peeled tag, git ls-remote 2026-10-19)
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Pin the Bicep CLI
        run: |
          az config set bicep.use_binary_from_path=false bicep.check_version=false --only-show-errors
          az bicep install --version "$BICEP_VERSION"
          az bicep version
      - name: Build and lint apps.bicep, failing on any warning
        run: python3 ci/bicep_check.py --runner az infra/apps.bicep
      - name: Build the image
        run: docker build --pull --tag "$REGISTRY_LOGIN_SERVER/agon:$GITHUB_SHA" .
      - name: Push the image (Entra token, no admin user)
        run: |
          az acr login --name "$REGISTRY_NAME"
          docker push "$REGISTRY_LOGIN_SERVER/agon:$GITHUB_SHA"
      # listCallbackUrl answers with the full trigger URL, SAS signature included. The
      # query keeps only basePath and api-version, so the signature never reaches
      # stdout, a file or a parameter; the worker authenticates with an Entra token.
      - name: Read the approval flow trigger URLs (base path and api-version only, never the SAS)
        run: |
          for name in la-agon-teams-approval la-agon-outlook-approval la-agon-teams-post; do
            id="$(az resource show --resource-group "$RESOURCE_GROUP" --resource-type Microsoft.Logic/workflows --name "$name" --query id --output tsv 2>/dev/null || true)"
            if [ -z "$id" ]; then
              echo "$name is not deployed; its URL stays empty"
              continue
            fi
            az rest --method post \
              --url "https://management.azure.com${id}/triggers/manual/listCallbackUrl?api-version=2019-05-01" \
              --query '{base: basePath, version: queries."api-version"}' --output json > "$RUNNER_TEMP/$name.callback.json" \
              || { echo "$name: listCallbackUrl failed; its URL stays empty"; rm -f "$RUNNER_TEMP/$name.callback.json"; }
          done
      - name: Write the apps.bicep parameters file
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          env = os.environ
          temp = env["RUNNER_TEMP"]

          def flow_url(name):
              path = os.path.join(temp, f"{name}.callback.json")
              if not os.path.exists(path):
                  return ""
              data = json.load(open(path, encoding="utf-8"))
              base, version = data.get("base") or "", data.get("version") or ""
              if not base.startswith("https://") or "?" in base or not re.fullmatch(r"[0-9-]{8,12}", version):
                  sys.exit(f"{name}: unexpected callback shape; refusing to pass it on")
              return f"{base}?api-version={version}"

          names = json.loads(env.get("FOUNDRY_DEPLOYMENT_NAMES") or "[]")
          values = {
              "location": env["LOCATION"],
              "image": f"{env['REGISTRY_LOGIN_SERVER']}/agon:{env['GITHUB_SHA']}",
              "storageAccountName": env["STORAGE_ACCOUNT"],
              "cosmosAccountName": env["COSMOS_ACCOUNT"],
              "cosmosDatabaseName": env["COSMOS_DATABASE"],
              "registryName": env["REGISTRY_NAME"],
              "environmentName": env["CONTAINER_ENV_NAME"],
              "foundryProjectEndpoint": env.get("FOUNDRY_PROJECT_ENDPOINT", ""),
              "foundryDeploymentNames": names,
              "translatorCustomEndpoint": env.get("TRANSLATOR_CUSTOM_ENDPOINT", ""),
              "speechEndpoint": env.get("SPEECH_ENDPOINT", ""),
              "speechResourceId": env.get("SPEECH_RESOURCE_ID", ""),
              "staticSiteHostname": env.get("STATIC_SITE_HOSTNAME", ""),
              "teamsFlowUrl": flow_url("la-agon-teams-approval"),
              "outlookFlowUrl": flow_url("la-agon-outlook-approval"),
              "teamsPostUrl": flow_url("la-agon-teams-post"),
          }
          for key in ("teamsFlowUrl", "outlookFlowUrl", "teamsPostUrl"):
              if "sig=" in values[key].lower():
                  sys.exit(f"{key} carries a SAS signature; refusing to pass it on")
          body = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {k: {"value": v} for k, v in values.items()},
          }
          with open(os.path.join(temp, "apps.parameters.json"), "w", encoding="utf-8") as fh:
              json.dump(body, fh)
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"### apps parameters\n\n- ai job: {env.get('AI_RESULT')}\n")
              fh.write(f"- AI parameters present: {all(values[k] for k in ('foundryProjectEndpoint', 'translatorCustomEndpoint', 'speechEndpoint', 'speechResourceId'))}; deployments: {names}\n")
              fh.write(f"- Teams flow URL: {'set' if values['teamsFlowUrl'] else 'empty (no card)'}; Outlook flow URL: {'set' if values['outlookFlowUrl'] else 'empty (no email)'}; Teams post URL: {'set' if values['teamsPostUrl'] else 'empty (no newsroom post)'}\n")
          PY
      - name: What-if apps.bicep (read only)
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APPS_DEPLOYMENT_NAME" \
            --template-file infra/apps.bicep \
            --parameters @"$RUNNER_TEMP/apps.parameters.json"
      - name: Deploy apps.bicep (incremental only, never complete)
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APPS_DEPLOYMENT_NAME" \
            --template-file infra/apps.bicep \
            --parameters @"$RUNNER_TEMP/apps.parameters.json" \
            --mode Incremental --query "properties.outputs" --output json > "$RUNNER_TEMP/apps-outputs.json"
          cat "$RUNNER_TEMP/apps-outputs.json"
      - name: Image and jobs in the job summary
        run: |
          fleet="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fleetJobName"]["value"] or "not deployed (AI parameters missing)")' "$RUNNER_TEMP/apps-outputs.json")"
          {
            echo "### apps: image $REGISTRY_LOGIN_SERVER/agon:$GITHUB_SHA"
            echo
            echo "Jobs deployed by agon-apps: job-agon-intake; fleet job: $fleet."
            echo "Executions need the owner-side rbac deploy (AcrPull, queue and blob roles) before they can pull and drain."
          } >> "$GITHUB_STEP_SUMMARY"
