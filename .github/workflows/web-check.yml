# Static checks for the web shell. Separate from the main CI workflow so the
# front-end lane can change it without touching platform files.
#
# The site that ships is the React console: the console workflow runs
# ci/web_check.py on its build and on the stamped copy, and the deploy runs it
# on the exact bytes it uploads. The retired hand-written page in web/ is the
# checker's fixture now; tests/test_web_check.py scans a copy of it with the
# design preview as its only run (tests/sitekit.py), so a recorded run listed
# first in web/runs, which the hand-written page cannot state, never fails here.
name: web-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Contrast table recomputed from tokens
        run: python ci/web_check.py web --print-contrast

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check "pytest==9.0.2"

      - name: Checker tests, each rule proven to fail once
        run: python -m pytest tests/test_web_check.py -q -p no:cacheprovider

      # Uses the runner's preinstalled node and its built-in test runner, so
      # nothing is installed. A runner without node fails here; it never skips.
      - name: Browser core tests (frame parity with Python, manifest rules, WebCrypto hash)
        run: |
          node --version
          node --test tests/js/core.test.js
