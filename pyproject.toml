[build-system]
# Pinned exactly so an editable install never pulls an unreviewed backend.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agon"
version = "0.1.0"
description = "Agon: a governed full-time match report for a fictional club media office, built on synthetic data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The frozen realism bands and their lock ship with the package (metric M2).
"agon.synth" = ["bands.json", "bands.lock", "bands_heldout.json"]
# The frozen interpret model and its lock (spec 4 row 2); without them a non-editable install
# leaves the model out and every matchfacts tool call raises ModelError.
"agon.interpret" = ["model.json", "model.lock"]
# The pinned prompts and their manifest (spec 4); load_prompt fails closed without them.
"agon.agents" = ["prompts/*.md", "prompts/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ci/ holds the stdlib gate scripts; tests import them as plain modules.
pythonpath = ["ci"]
