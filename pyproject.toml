[build-system]
# Pinned exactly so an editable install never pulls an unreviewed backend.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agon"
version = "0.1.0"
description = "Agon: a governed full-time match report for a fictional club media office, built on synthetic data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ci/ holds the stdlib gate scripts; tests import them as plain modules.
pythonpath = ["ci"]
