    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#agon-banner-bg)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3">
    <rect x="760" y="36" width="380" height="164" rx="4"/>
    <line x1="950" y1="36" x2="950" y2="200"/>
    <circle cx="950" cy="118" r="34"/>
    <rect x="760" y="78" width="54" height="80"/>
    <rect x="1086" y="78" width="54" height="80"/>
  </g>
